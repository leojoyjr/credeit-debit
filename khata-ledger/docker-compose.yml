version: '3.8'

services:
  khata-ledger:
    build: .
    container_name: khata-ledger-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=change_this_to_a_random_32_character_string_in_production!
      - DB_PATH=/app/data/khata.db
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
